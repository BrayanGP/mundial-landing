name: Deploy a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/2026-world-cup-landing-q76q72
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela los que ya están corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          # El sitio es estático y vive en la raíz del repo.
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
